---
all:
    vars:
      first_SV: 280 # First SV counter defined in PCAP file
      stream_to_log: 4001 # Desired SV stream to record. If not set, all streams are logged.
      svtrace_venv_path: /tmp/svtrace_venv/
    children:
        standalone_machine:
            children:
                hypervisors:
                    hosts:
                        10.0.0.2: # Change as desired
                            # Ansible variables
                            ansible_host: 10.0.0.2
                            ansible_user: root # capture interfaces, FIFO sched, ...
                            ansible_python_interpreter: /usr/bin/python3
                            ansible_connection: ssh
                            ansible_ssh_private_key_file:
                            ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
                            ansible_remote_tmp: /tmp/.ansible/tmp

                            # Main network configuration
                            network_interface: prpint

                            sv_interface: enp24s0 # SV reception interface
                            sv_ts_core: 1 # sv_timestamp_logger CPU core
                            enable_svtrace: true # Enable svtrace tracing
                            svtrace_core: 2 # Core to run svtrace (should be isolated)
                            enable_sv_ts: true # Enable sv_timestamp_logger

                publisher:
                    hosts:
                        10.0.0.1: # Change as desired
                            # Ansible variables
                            ansible_host: 10.0.0.1
                            ansible_user: root # root (FIFO sched)
                            ansible_python_interpreter: /usr/bin/python3
                            ansible_connection: ssh
                            ansible_ssh_private_key_file:
                            ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
                            ansible_remote_tmp: /tmp/.ansible/tmp

                            # Main network configuration
                            network_interface:

                            # PTP configuration
                            ptp_interface: # PTP interface
                            ptp_core: # ptp4l CPU core
                            phc_core: # phc2sys CPU core
                            ptp_device: # PTP device synchronized by ptp4l

                            sv_interface: prp # SV transmission interface

                            pcap_file: /home/virtu/yoann/SV_Normal_Traffic.pcap # PCAP file to be used (absolute path)
                            pcap_cycles: 10 # Number of PCAP loops to repeat
                            sv_ts_core: 2 # sv_timestamp_logger CPU core
                            enable_sv_ts: true # Enable sv_timestamp_logger
                            bittwist_core: 1 # bittwist CPU core
                            ptp_manual_configuration: false # Set to false to disable ptp configuration
